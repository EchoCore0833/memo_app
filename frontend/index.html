<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモ帳アプリ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="memo-app">
        <aside class="memo-sidebar">
            <div class="sidebar-controls">
                <button id="new-memo-button" type="button">
                    + 新規
                </button>

                <label class="visually-hidden" for="memo-sort">
                    並び替え
                </label>

                <select id="memo-sort" name="sort">
                    <option value="updated-desc">
                        更新日時（新しい順）
                    </option>
                    <option value="updated-asc">
                        更新日時（古い順）
                    </option>
                    <option value="created-desc">
                        登録日時（新しい順）
                    </option>
                    <option value="created-asc">
                        登録日時（古い順）
                    </option>
                    <option value="title-asc">
                        タイトル（昇順）
                    </option>
                    <option value="title-desc">
                        タイトル（降順）
                    </option>
                </select>
            </div>

            <p id="memo-status" role="status">
                読み込み中...
            </p>

            <ul id="memo-list" class="memo-list"></ul>
        </aside>

        <main class="memo-editor">
            <form id="memo-form">
                <label class="visually-hidden" for="memo-title">
                    タイトル
                </label>

                <input id="memo-title" name="title" type="text" maxlength="100" placeholder="タイトル">

                <label class="visually-hidden" for="memo-content">
                    本文
                </label>

                <textarea id="memo-content" name="content" maxlength="10000" placeholder="本文"></textarea>

                <div class="editor-actions">
                    <button type="submit">
                        保存
                    </button>
                    <button id="delete-memo-button" type="button" disabled>
                        削除
                    </button>
                    <span id="memo-form-status" role="status"></span>
                </div>
            </form>
        </main>
    </div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <script type="module" src="js/app.js"></script>
</body>
</html>
