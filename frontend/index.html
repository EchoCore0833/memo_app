<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo App - 動作確認</title>
</head>
<body>
    <h1>Memo App</h1>

    <form id="memo-form">
        <p>
            <label for="memo-title">タイトル</label>
            <input id="memo-title" name="title" type="text" maxlength="255" required>
        </p>
        <p>
            <label for="memo-content">本文</label>
            <textarea id="memo-content" name="content" required></textarea>
        </p>
        <button type="submit">登録</button>
        <p id="memo-form-status" role="status"></p>
    </form>

    <p id="memo-status" role="status">読み込み中...</p>
    <ul id="memo-list"></ul>
    <script type="module" src="js/app.js"></script>
</body>
</html>
