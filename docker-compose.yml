
services:
  # Nginx（配布環境）
  nginx:
    image: nginx:1.29.7
    ports:
      - "8000:80"
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app

  # PHP-FPM（配布環境）
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./htdocs:/var/www/html
    depends_on:
      - mysql

  # MySQL（メモアプリ・配布環境共通）
  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Tokyo
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" > /dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"

  # Node.js / Express（メモアプリ）
  node:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      TZ: Asia/Tokyo
    depends_on:
      mysql:
        condition: service_healthy

  # フロントエンド用Nginx
  frontend:
    image: nginx:1.29.7
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  # phpMyAdmin（MySQL管理画面）
  phpmyadmin:
    image: phpmyadmin:5.2.3
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    depends_on:
      - mysql

volumes:
  mysqldata:
